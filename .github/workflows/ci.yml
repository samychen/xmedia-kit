name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tool-smokes:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg（时长探测/SFX 再生成依赖）
        run: brew install ffmpeg
      - name: hf_tts 链路冒烟（本地 HTTP mock，不依赖 say/网络）
        run: python3 tests/unit/hf_tts_smoke.py
      - name: hf_studio 注入冒烟
        run: python3 tests/unit/hf_studio_smoke.py
      - name: gallery 示例库 compose+validate
        run: python3 tests/unit/gallery_smoke.py
      - name: schema 版本门
        run: |
          python3 - <<'PY'
          import json, subprocess, sys, tempfile, os
          spec = {"composition": {"id": "v"}, "scenes": [{"type": "title", "text": "x"}],
                  "schema_version": "9.9"}
          with tempfile.TemporaryDirectory() as tmp:
              p = os.path.join(tmp, "bad.json")
              json.dump(spec, open(p, "w"), ensure_ascii=False)
              proc = subprocess.run([sys.executable, "tools/hf_compose.py", p],
                                    capture_output=True, text=True)
              assert proc.returncode == 1 and "不受支持" in proc.stderr
          print("schema gate: PASS")
          PY

  engine-tests:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 引擎测试需要本机工具链（钉版 FFmpeg 构建 + CEF SDK + html_bake bundle）
        run: |
          echo "引擎层测试（ctest 1029）依赖本地钉版 FFmpeg 与 CEF SDK——"
          echo "在配好工具链的机器上运行：cmake -B build && cmake --build build && ctest"
          echo "（见 docs/HF_COMPOSE.md 与仓库 README 的构建章节）"
