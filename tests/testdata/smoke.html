<!DOCTYPE html>
<!-- CEF OSR 冒烟测试页：元素带 HyperFrames data-* 时序/层级声明，
     MakeRectsScript 收集器按 [data-start],[data-duration],[data-z] 选择，
     经 mc.html.rects 上报给 CefLayerSource 的元数据层。 -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; }
  .box { position: absolute; }
</style>
</head>
<body>
  <div class="box" data-mc-id="bg" data-start="0" data-z="0"
       style="left:0; top:0; width:100%; height:100%; background:#204080;"></div>
  <div class="box" data-mc-id="title" data-start="0" data-duration="5000" data-z="1"
       style="left:20px; top:40px; width:280px; height:60px;
              background:#804020; color:#fff; font:24px sans-serif;">
    xmedia-kit CEF smoke
  </div>
  <div class="box" data-mc-id="chip" data-start="500" data-duration="3000" data-z="2"
       style="left:60px; top:140px; width:200px; height:50px; background:#208040;"></div>
</body>
</html>
